[package]
name = "mellow"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.8.0", package = "libadwaita", features = ["v1_7"] }
gst = { version = "0.24.2", package = "gstreamer" }
gtk = { version = "0.10.0", package = "gtk4", features = ["v4_18"] }
lofty = "0.22.4"
# mpris-server = "0.9.0" # TODO: MPRIS integration
rand = "0.9.2"
relm4 = { version = "0.10.0", features = ["libadwaita"]}
relm4-components = { version = "0.10.0", features = ["libadwaita"]}
