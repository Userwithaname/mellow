[package]
name = "mellow"
version = "0.4.2"
edition = "2024"
license = "GPL-3.0"

[features]
default = [
  # "no-meson", # Cargo build support; requires manual gschema setup
  # "startup-logs", # Enables more verbose output for startup events
  # "lock-warnings", # Prints warnings if certain locks are not immediately obtainable
  # "task-counter", # Counts/prints how many threads are busy on the thread pool
]
no-meson = ["dep:glib-build-tools"]
startup-logs  = []
lock-warnings = []
task-counter  = []

[build-dependencies]
glib-build-tools = { version = "0.22.0", optional = true }

[dependencies]
adw           = { version = "0.9.0",  package = "libadwaita",   features = ["v1_9"]  }
async-channel = { version = "2.5.0",  default-features = false                       }
fastrand      = { version = "2.5.0",  default-features = false                       }
gst           = { version = "0.25.0", package = "gstreamer"                          }
gtk           = { version = "0.11.0", package = "gtk4",         features = ["v4_22"] }
lofty         = { version = "0.24.0", default-features = false                       }
mpris-server  = { version = "0.10.0", default-features = false                       }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
codegen-units = 1
lto = true
overflow-checks = false
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
overflow-checks = false
strip = true

[profile.bench]
debug = "line-tables-only"
strip = false

[profile.bench.package."*"]
debug = "line-tables-only"
strip = false

[lints.clippy]

## --- Deny
let_underscore_future = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

## --- Warn
clear_with_drain = "warn"
deref_by_slicing = "warn"
fallible_impl_from = "warn"
match_wildcard_for_single_variants = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
must_use_candidate = "warn"
needless_collect = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
ptr_cast_constness = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_allocation = "warn"
redundant_as_str = "warn"
redundant_clone = "warn"
redundant_closure = "warn"
redundant_closure_call = "warn"
redundant_closure_for_method_calls = "warn"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
single_option_map = "warn"
str_to_string = "warn"
# suboptimal_flops = "warn"
todo = "warn"
unreadable_literal = "warn"
unnecessary_semicolon = "warn"
unnecessary_trailing_comma = "warn"

## --- Warn (documentation)
doc_broken_link = "warn"
doc_comment_double_space_linebreaks = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_long_first_doc_paragraph = "warn"

## --- Allow
match_bool = "allow"
